<script>
// 인앱 브라우저 감지 → 외부 브라우저로 이동
// 카카오톡, 에브리타임, 인스타그램, 페이스북, 네이버, 밴드 등
(function() {
  var ua = navigator.userAgent.toLowerCase();
  var target = location.href;
  // 카카오톡 인앱
  if (ua.match(/kakaotalk/i)) {
    location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(target);
    return;
  }
  // 네이버 앱
  if (ua.match(/naver/i) && ua.match(/inapp/i)) {
    // iOS는 intent 스킴을 무시하므로 외부 브라우저 안내만 가능
    if (/iphone|ipad|ipod/i.test(ua)) {
      alert('원활한 이용을 위해 Safari에서 열어주세요.\n\n하단 또는 우측 메뉴 → "Safari로 열기"를 눌러주세요.');
    } else {
      location.href = 'intent://' + target.replace(/https?:\/\//i, '') +
        '#Intent;scheme=https;package=com.android.chrome;end';
    }
    return;
  }
  // 에브리타임, 인스타그램, 페이스북, 밴드, 기타 인앱 WebView
  if (ua.match(/everytime|instagram|fbav|fb_iab|band\/|lineapp|twitter/i)) {
    // iOS: Safari로 열기 시도
    if (/iphone|ipad|ipod/i.test(ua)) {
      // 딥링크 방식은 제한적이므로 안내 알림
      alert('원활한 이용을 위해 Safari 또는 Chrome에서 열어주세요.\n\n우측 상단 ⋯ 메뉴 → "기본 브라우저로 열기"를 눌러주세요.');
    } else {
      // Android: Chrome intent
      location.href = 'intent://' + target.replace(/https?:\/\//i, '') +
        '#Intent;scheme=https;package=com.android.chrome;end';
    }
  }
})();
</script>

  <h1>LEET 표준점수 계산기</h1>
  <p>법학적성시험(LEET) 원점수를 <strong>표준점수·백분위·표점합</strong>으로 환산해 주는 무료 웹 계산기입니다. 2009~2026학년도 환산표를 모두 지원하며, 25개 법학전문대학원(로스쿨)의 학교별 LEET 환산식과 입시결과를 비교하고 기출문제 PDF를 제공합니다. 회원가입 없이 사용할 수 있습니다.</p>

  </ul>

  <h2>LEET 표준점수란</h2>
  <p>표준점수는 매년 다른 시험 난이도를 보정한 점수로, (원점수 − 응시자 평균) ÷ 표준편차로 구한 Z점수에 영역별 기준 표준편차를 곱하고 기준 평균을 더해 산출합니다. 원점수가 같아도 연도에 따라 표준점수는 달라집니다. <strong>구리트(2009~2019)</strong>는 언어이해·추리논증 모두 평균 50·표준편차 10을, <strong>신리트(2020~)</strong>는 언어이해 평균 45·표준편차 9, 추리논증 평균 60·표준편차 12를 사용합니다.</p>
  <p><strong>표점합</strong>은 언어이해 표준점수와 추리논증 표준점수를 더한 값으로, 다수 로스쿨이 환산표 입력값으로 씁니다. 대부분의 학교는 표준점수를, 서울대는 백분위를, 아주대·부산대는 둘을 혼합해 사용합니다.</p>
